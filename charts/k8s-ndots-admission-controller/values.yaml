# Default values for k8s-ndots-admission-controller.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: hawky4s/k8s-ndots-admission-controller
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Common annotations to add to all resources
commonAnnotations: {}
  # maintainer_team: my-team
  # environment: production

# Common labels to add to all resources
commonLabels: {}

# DNS settings management.
#
# The webhook applies the settings below to every in-scope pod. Nothing is
# managed out of the box: with dns.nameservers/searches/options/policy all
# empty, the webhook is a no-op. To manage the classic ndots value, add it as
# an ordinary option (see dns.options below).
#
# The strategy controls how managed values combine with what the pod already
# declares:
#   merge    - add/update managed keys, leave the pod's other DNS settings
#              (union for nameservers/searches). Default.
#   update   - only change a field/option that is already present on the pod.
#   unset    - remove the managed options/fields from the pod.
#   override - replace the whole managed field with the configured value.
dns:
  # Default strategy: merge, update, unset, or override.
  strategy: "merge"
  # Gate which pods the webhook mutates, via a pod annotation:
  #   always  - mutate every in-scope pod (ignore the annotation).
  #   opt-in  - mutate only pods carrying enableAnnotationKey: "true".
  #   opt-out - mutate every in-scope pod unless it carries
  #             enableAnnotationKey: "false". Default.
  annotationMode: "opt-out"
  # Annotation key consulted for opt-in/opt-out gating.
  enableAnnotationKey: "dns.hawky.dev/dns"
  # Top-level pod dnsPolicy: "" (leave unmanaged), None, ClusterFirst,
  # ClusterFirstWithHostNet, or Default. Note: None requires at least one
  # nameserver; the webhook skips the change (and logs) rather than emit a
  # patch the API server would reject.
  policy: ""
  # dnsConfig.nameservers to apply (list of IPs).
  nameservers: []
  # dnsConfig.searches to apply (list of search domains).
  searches: []
  # dnsConfig.options to apply. Values are strings and must be quoted. Use an
  # option without a value (omit "value") for flags like edns0. Set the classic
  # ndots value here, e.g.:
  # options:
  #   - name: ndots
  #     value: "2"
  #   - name: edns0
  #   - name: timeout
  #     value: "1"
  options: []
  # Pod annotation carrying a full DNS spec as JSON or YAML (Vault
  # agent-injector style); it overlays the values above per pod.
  annotationKey: "dns.hawky.dev/dns-config"
  # Pod annotation overriding the strategy for a single pod.
  strategyAnnotationKey: "dns.hawky.dev/dns-strategy"

# Namespace filtering
namespace:
  # Namespaces to exclude from mutation (always excluded)
  exclude:
    - kube-system
    - kube-public
    - kube-node-lease
  # Namespaces to include (if empty, all non-excluded namespaces are included)
  include: []

# Webhook configuration
webhook:
  # What to do if the webhook fails: Ignore or Fail
  failurePolicy: Ignore
  # Timeout for webhook calls
  timeoutSeconds: 10
  # Reinvocation policy: Never or IfNeeded
  reinvocationPolicy: Never

# TLS configuration
tls:
  # Use cert-manager for certificate management
  useCertManager: true
  # cert-manager specific settings
  certManager:
    # Duration of the certificate
    duration: 8760h # 1 year
    # When to renew
    renewBefore: 720h # 30 days
    issuer:
      # Create a self-signed issuer
      create: true
      # Name of existing issuer (if create is false)
      name: ""
      # Kind: Issuer or ClusterIssuer
      kind: Issuer

# Logging configuration
logging:
  # Log level: debug, info, warn, error
  level: info
  # Log format: json or text
  format: json

# Metrics configuration
metrics:
  # Enable metrics endpoint
  enabled: true
  # Metrics port
  port: 8080
  # Service monitor for Prometheus Operator
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    scrapeTimeout: 10s

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65534

service:
  type: ClusterIP
  port: 443

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}

tolerations: []

affinity: {}

# Priority class name
priorityClassName: ""

# Pod disruption budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1
  # maxUnavailable: 1
