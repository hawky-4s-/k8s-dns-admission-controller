name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  # Required for cosign keyless signing and SLSA provenance via OIDC
  id-token: write
  # Required for SBOM/provenance attestations on the image
  attestations: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Embed SBOM and SLSA provenance into the image manifest
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Sign image with cosign (keyless)
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      # actions/attest is the unified attestation action. attest-sbom and
      # attest-build-provenance (v4+) are wrappers around it; calling attest
      # directly removes the wrapper layer.
      # Mode is auto-detected: providing sbom-path -> SBOM mode; no
      # sbom-path/predicate inputs -> SLSA build provenance mode.
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: ./release-assets

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@c9bcd8238b6f41e05561348339429d360b1c0247 # v6.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## Image

            `${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller@${{ needs.build-and-push.outputs.digest }}`

            Verify the signature:

            ```sh
            cosign verify ${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller@${{ needs.build-and-push.outputs.digest }} \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.+' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
            ```
          files: ./release-assets/sbom.spdx.json
          prerelease: false
          generate_release_notes: true
