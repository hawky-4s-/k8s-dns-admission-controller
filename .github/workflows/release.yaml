name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, semver without 'v' prefix (e.g. 2.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  # Required for cosign keyless signing and SLSA provenance via OIDC
  id-token: write
  # Required for SBOM/provenance attestations on the image
  attestations: write

jobs:
  # Run the full CI suite against main HEAD before anything is built, pushed, or
  # tagged. The Chart.yaml bump that happens later is metadata-only and does not
  # affect the Go tests or the image contents, so testing pre-bump is valid.
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0

      # Fail fast on anything that isn't bare semver (e.g. a leading "v").
      - name: Validate version input
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::version '$VERSION' is not bare semver (e.g. 2.1.0, no 'v' prefix)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          # Derive the major.minor moving tag (e.g. 2.1) from the core version,
          # ignoring any prerelease/build metadata.
          echo "VERSION_MAJOR_MINOR=$(printf '%s' "$VERSION" | sed -E 's/^([0-9]+\.[0-9]+).*/\1/')" >> "$GITHUB_ENV"

      # Bump the chart's version + appVersion and commit LOCALLY. Nothing is
      # pushed until the image is safely in the registry (see push-back step).
      # The image tag defaults to .Chart.AppVersion in the chart, so keeping
      # appVersion == the released image tag is required.
      #
      # Idempotent: if Chart.yaml is already at this version (e.g. re-running a
      # release whose chart-publish step failed), there is nothing to commit and
      # we skip the commit rather than error.
      - name: Bump Chart.yaml (local commit, not pushed)
        env:
          CHART: charts/k8s-dns-admission-controller/Chart.yaml
        run: |
          sed -i -E "s/^version: .*/version: ${VERSION}/" "$CHART"
          sed -i -E "s/^appVersion: .*/appVersion: \"${VERSION}\"/" "$CHART"
          echo "--- bumped $CHART ---"
          grep -E '^(version|appVersion):' "$CHART"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Chart.yaml already at v${VERSION}; nothing to commit."
          else
            git commit -am "chore(release): v${VERSION}"
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The image tag comes straight from the validated input. We deliberately do
      # NOT use docker/metadata-action's type=semver here, since the git tag does
      # not exist yet at this point in the flow.
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=${{ env.VERSION_MAJOR_MINOR }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Embed SBOM and SLSA provenance into the image manifest
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Sign image with cosign (keyless)
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      # actions/attest is the unified attestation action. attest-sbom and
      # attest-build-provenance (v4+) are wrappers around it; calling attest
      # directly removes the wrapper layer.
      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      # The image is now in the registry. Only NOW do we advertise the release by
      # pushing the bump commit to main and the v<version> tag on top of it. If the
      # workflow fails before this step, main and tags are untouched.
      #
      # Note on re-runs: if the workflow dies AFTER this step, the image and tag
      # already exist; re-running with the same version overwrites the image and
      # the push below no-ops or fast-forwards. Bump the version for a clean retry.
      - name: Push commit and tag
        run: |
          git push origin HEAD:main
          if git ls-remote --exit-code --tags origin "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists on origin; skipping tag push."
          else
            git tag -a "v${VERSION}" -m "Release v${VERSION}"
            git push origin "v${VERSION}"
          fi

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@c9bcd8238b6f41e05561348339429d360b1c0247 # v6.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ env.VERSION }}
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## Image

            `${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller@${{ steps.build.outputs.digest }}`

            Verify the signature:

            ```sh
            cosign verify ${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller@${{ steps.build.outputs.digest }} \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.+' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
            ```
          files: sbom.spdx.json
          prerelease: false
          generate_release_notes: true

      # Publish the chart LAST. The bumped Chart.yaml is already in this job's
      # working tree (committed above and pushed to main), so chart-releaser
      # packages the correct version and publishes it to the gh-pages branch.
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Release chart
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: charts
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
