name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  # Required for cosign keyless signing and SLSA provenance via OIDC
  id-token: write
  # Required for SBOM/provenance attestations on the image
  attestations: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  build-and-push:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to DockerHub
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Embed SBOM and SLSA provenance into the image manifest
          sbom: true
          provenance: mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v3.1.1'

      - name: Sign image with cosign (keyless)
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate SBOM (SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      # actions/attest is the unified attestation action. attest-sbom and
      # attest-build-provenance (v4+) are wrappers around it; calling attest
      # directly removes the wrapper layer.
      # Mode is auto-detected: providing sbom-path -> SBOM mode; no
      # sbom-path/predicate inputs -> SLSA build provenance mode.
      - name: Attest SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

      - name: Attest build provenance
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-name: index.docker.io/${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: sbom.spdx.json

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom
          path: ./release-assets

      - name: Generate Changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@c9bcd8238b6f41e05561348339429d360b1c0247 # v6.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3.0.1
        with:
          body: |
            ${{ steps.changelog.outputs.changelog }}

            ## Image

            `${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller@${{ needs.build-and-push.outputs.digest }}`

            Verify the signature:

            ```sh
            cosign verify ${{ secrets.DOCKERHUB_USERNAME }}/k8s-dns-admission-controller@${{ needs.build-and-push.outputs.digest }} \
              --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.+' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com'
            ```
          files: ./release-assets/sbom.spdx.json
          prerelease: false
          generate_release_notes: true
